# Ship nginx access logs to the nginxlog-exporter over syslog (UDP) for App/RED metrics.
# The live nginx config lives on the VPS (/opt/chtivo/nginx/conf.d/); this is the tracked
# reference. Deployed as /opt/chtivo/nginx/conf.d/00-red-logging.conf.
#
# The `red` format must match monitoring/nginxlog-exporter/config.yml. The 00- prefix loads
# this before app.conf so log_format `red` exists before app.conf's servers inherit the
# access_log. This is additive — stdout logging (from nginx.conf) keeps working.
log_format red '$host $remote_addr - "$request" $status $request_time';
access_log syslog:server=nginxlog-exporter:5140,facility=local7,tag=nginx,severity=info red;
