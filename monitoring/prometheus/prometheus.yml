# Prometheus scrape config — Phase 1 (infra/USE + DB).
# Targets are resolved by Docker service name on the chtivo_default network.
# App RED metrics (Phase 2) and Pushgateway/PSI (Phase 4) get added later.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor          # per-container USE (CPU/mem/net/disk)
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node              # host USE
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres          # Supabase Postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: nginx             # App RED (rate/errors/latency) at the ingress
    static_configs:
      - targets: ['nginxlog-exporter:4040']

  - job_name: app               # Next app: RUM web-vitals + nodejs_* process metrics
    static_configs:
      - targets: ['app:3000']

  - job_name: pushgateway     # synthetic PSI (pushed by the VPS crontab)
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
