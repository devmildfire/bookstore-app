# Observability stack — Prometheus + Grafana + exporters (Phases 0–1).
# Joins the existing chtivo_default network so Prometheus can scrape exporters by
# service name and nginx can reach `grafana:3000`. Nothing is published to the host
# or exposed publicly here — exposure is one nginx server block + one Cloudflare
# tunnel public-hostname (see docs/monitoring/README.md). Versions pinned.
#
# Deploy on the VPS:  docker compose -p monitoring --env-file .env up -d

services:
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    networks: [chtivo_default]

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      # Public read-only: anonymous viewers, no sign-up, admin stays password-gated.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_SERVER_ROOT_URL: "https://grafana.mildfire.dev"
      # Drop the blog/news feed — this is a focused showcase, not a Grafana intro.
      # (The home dashboard is set to the consolidated "observability" board via the
      # org-preference API — GF_USERS_DEFAULT_HOME_DASHBOARD_PATH isn't honored in 11.3;
      # see docs/monitoring/README.md. The preference persists in the grafana_data volume.)
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    networks: [chtivo_default]

  cadvisor:
    # v0.55+ required: this host's Docker uses the containerd snapshotter (Storage
    # Driver: overlayfs, no classic image/overlay2/layerdb). v0.49 fails the rw-layer
    # lookup and emits ZERO per-container metrics; v0.55.1 handles it cleanly.
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    restart: unless-stopped
    command: ['--housekeeping_interval=30s', '--store_container_labels=false']
    privileged: true
    # cgroup v2 + cgroupns: cAdvisor must share the host cgroup namespace or it only
    # sees its own cgroup, not the other containers' (no per-container metrics).
    cgroup: host
    devices: ['/dev/kmsg']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    networks: [chtivo_default]

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    networks: [chtivo_default]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    environment:
      # Reuses the stack's Postgres password (set in .env). `db` is the Supabase
      # Postgres service alias on chtivo_default.
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@db:5432/postgres?sslmode=disable"
    mem_limit: 128m
    networks: [chtivo_default]

  nginxlog-exporter:
    # RED from the nginx ingress: nginx ships access logs here over syslog/UDP.
    image: ghcr.io/martin-helmich/prometheus-nginxlog-exporter/exporter:v1.9.2@sha256:62987d855bb07edc5d126b926751c733e6683a6a6d2844026d3af332bac654be
    restart: unless-stopped
    command: ['-config-file', '/etc/nginxlog/config.yml']
    volumes:
      - ./nginxlog-exporter/config.yml:/etc/nginxlog/config.yml:ro
    mem_limit: 64m
    networks: [chtivo_default]

  pushgateway:
    # Sink for the synthetic PSI batch job; Prometheus scrapes it with honor_labels
    # so the pushed job/strategy labels are preserved.
    image: prom/pushgateway:v1.11.3@sha256:74fa117cef2d7e383112d25139ff1c2d2e309c35389a9e0554a47136a1482e48
    restart: unless-stopped
    mem_limit: 64m
    networks: [chtivo_default]

  psi-scheduler:
    # Containerized scheduler for the synthetic PSI probe. A loop (not host cron/systemd)
    # because the deploy user has no passwordless sudo and the host cron daemon is off —
    # and a compose service is more reproducible anyway (see ADR-0003). Runs on start,
    # then every 6h; `timeout` guards a hung run. Reads the SA key from ./psi (ro).
    image: node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
    restart: unless-stopped
    command: ["sh", "-c", "while true; do timeout 300 node /psi/psi-push.mjs || echo 'psi run failed'; sleep 21600; done"]
    volumes:
      - ./psi:/psi:ro
    mem_limit: 128m
    networks: [chtivo_default]

  alertmanager:
    # Routes firing alerts (from Prometheus) to Telegram. Config + bot token live on
    # the VPS only (gitignored; alertmanager.yml is rendered from .example with the
    # real chat_id, and the token is in a mounted file). See docs/monitoring/README.md.
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    # Run as the deploy user (uid 1000) that owns the 600 token file, so the secret
    # stays 600 (not world-readable); data dir → /tmp since that uid can't write the
    # image's default /alertmanager.
    user: "1000:1000"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/tmp/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/telegram_token:/etc/alertmanager/telegram_token:ro
    mem_limit: 64m
    networks: [chtivo_default]

networks:
  chtivo_default:
    external: true

volumes:
  prometheus_data:
  grafana_data:
