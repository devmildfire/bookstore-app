# Internal reverse proxy. Reached ONLY by cloudflared over the docker network
# (no host ports). Routes by Host: app vs Supabase API. Studio is intentionally
# NOT routed here (private; SSH tunnel only).

# Real visitor IP: cloudflared forwards it in CF-Connecting-IP. Trust only the
# private docker network (nothing else can reach this nginx) and never the open
# internet's forwarding headers.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Resolve upstreams at request time via Docker's embedded DNS (127.0.0.11), not
# once at boot. Two reasons: (1) nginx starts even if an upstream container is
# temporarily absent (it returns 502 instead of refusing to load its config);
# (2) on an app/kong redeploy the container gets a NEW IP — a static
# `proxy_pass http://app:3000` caches the old IP and 502s until nginx reloads.
# Using a variable in proxy_pass forces per-request re-resolution.
resolver 127.0.0.11 valid=10s ipv6=off;

# Drop requests with an unexpected Host (defense-in-depth behind the tunnel).
server {
  listen 80 default_server;
  server_name _;

  # Container liveness probe. The docker HEALTHCHECK hits http://127.0.0.1/healthz
  # from inside the container; that Host matches no vhost → lands here on the
  # default_server, so /healthz must return 200 while everything else stays 444.
  # Dependency-free: proves nginx is serving, not that any upstream is up.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 444;
  }
}

# ── Storefront / admin app ──────────────────────────────────────────────────
server {
  listen 80;
  server_name bookstore-app.mildfire.dev;

  client_max_body_size 10m;   # avatar/story uploads go to Supabase, not here

  location / {
    set $app_upstream app:3000;
    proxy_pass http://$app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ── Supabase API (Kong) — Auth / REST / Storage / Realtime ──────────────────
server {
  listen 80;
  server_name api.mildfire.dev;

  # Storage uploads (50 MiB file limit in storage-api) — allow headroom.
  client_max_body_size 60m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    set $kong_upstream kong:8000;
    proxy_pass http://$kong_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # Realtime websockets (/realtime/v1/*)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ── Grafana (monitoring dashboards) ─────────────────────────────────────────
server {
  listen 80;
  server_name grafana.mildfire.dev;

  location / {
    set $grafana_upstream grafana:3000;
    proxy_pass http://$grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # Grafana Live (websockets)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
