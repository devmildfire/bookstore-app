_format_version: "3.0"
_transform: true

# Minimal Supabase API gateway for the legacy HS256 key model: route the public
# API prefixes to the internal services, strip the prefix, handle CORS. The
# services themselves validate JWTs (GoTrue / PostgREST / storage) and RLS
# protects the data, so no key-auth / apikey→JWT translation is needed at this
# layer. No env templating → the file is mounted read-only as-is (no generation
# step, no writable /home/kong needed).

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, Prefer, Range, X-Requested-With]
          exposed_headers: [Content-Range, Content-Location]
          max_age: 3600

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, Prefer, Range, X-Requested-With]
          exposed_headers: [Content-Range, Content-Location]
          max_age: 3600

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: [GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS]
          headers: [Accept, Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version, Prefer, Range, X-Requested-With, Cache-Control, X-Upsert]
          exposed_headers: [Content-Range, Content-Location]
          max_age: 3600
