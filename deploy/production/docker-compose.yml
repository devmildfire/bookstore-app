# Production stack for chtivo / mildfire.dev — single VPS, Cloudflare Tunnel model.
#
# DRAFT — adapted from the official Supabase self-hosting compose, trimmed to the
# services this app needs, and split by which versions must match the local dump.
#
#   Stateful services (schema/migration state lives in the restored dump) are
#   PINNED to the exact local versions — postgres / auth / storage / realtime.
#   Stateless gateway/UI services use the official tested versions.
#
# Nothing publishes host ports: cloudflared is the only ingress (Tunnel), reaching
# nginx over the internal docker network. Postgres + Studio are never exposed.
#
# ⚠️ NOT yet rehearsed end-to-end. Before trusting it, run the local restore
# rehearsal (see deploy/production/README.md) to confirm: role passwords after
# restore (roles.sql), storage path layout, and fresh prod key wiring.

name: chtivo

services:
  # ── Reverse proxy (internal): Host-based routing, real visitor IP, body limits ──
  nginx:
    image: nginx:1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    depends_on: [app, kong]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    # Liveness: nginx is serving (busybox wget ships in nginx:alpine). Hits the
    # default_server /healthz (returns 200 regardless of Host) — see nginx/conf.d/app.conf.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No ports: cloudflared reaches it at http://nginx:80 on the internal network.

  # ── Cloudflare Tunnel: the ONLY ingress. No public host ports anywhere. ─────────
  cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [nginx]

  # ── Next.js app (image from GHCR; built by CI) ─────────────────────────────────
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Canonical public identity (metadataBase / OG / sitemap) — baked into the
      # image at build; set here too for parity / any runtime read.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      # Runtime origin for redirects + payment callbacks (getSiteOrigin reads this
      # FIRST). Must be the real public URL so the env-agnostic image resolves its
      # own origin without relying on the build-baked value.
      APP_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      # The browser talks to its own origin under /sb; the app's middleware proxies
      # /sb/* to Supabase via SUPABASE_INTERNAL_URL and injects SUPABASE_ANON_KEY.
      # All Supabase config is RUNTIME now — nothing Supabase-specific is baked.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID}
      ADMIN_NOTIFICATIONS_EMAIL: ${ADMIN_NOTIFICATIONS_EMAIL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
    depends_on:
      kong:
        condition: service_started

  # ── Supabase API gateway (stateless → official tested version) ─────────────────
  kong:
    image: kong/kong:3.9.3@sha256:9a2ae6699a2ce0d60592eb176555d3594a22782c20cc6557a61ff3a7e8b559a3
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      # Static declarative config (no env templating); mounted read-only.
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./volumes/api/kong.yml:/home/kong/kong.yml:ro
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }

  # ── Auth / GoTrue (STATEFUL: pinned to local) ──────────────────────────────────
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.193.1@sha256:1399c3e86b23400d1858ac830a8aeb4ce55fd3e25a2b9205133e0b21b08ac8e5
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Asymmetric signing (Solution B): when JWT_KEYS is a non-empty array, GoTrue signs new
      # session JWTs with the ES256 key in it and validates both ES256 + the legacy HS256 oct
      # key it also contains. Empty (default) → stays HS256 via GOTRUE_JWT_SECRET above.
      GOTRUE_JWT_KEYS: "${JWT_KEYS:-[]}"
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      # Google OAuth. Enabled only when GOOGLE_ENABLED=true + creds set in .env.
      # Google Cloud Console must authorize the redirect URI below
      # (= API_EXTERNAL_URL/auth/v1/callback). The post-provider redirect to the
      # app (.../auth/callback) is covered by GOTRUE_URI_ALLOW_LIST above.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      # Send-Email hook → the Next.js app (internal docker DNS), renders + sends via Resend.
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: "true"
      GOTRUE_HOOK_SEND_EMAIL_URI: ${NEXT_PUBLIC_BASE_URL}/api/auth/hooks/send-email
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${SEND_EMAIL_HOOK_SECRET}

  # ── PostgREST (stateless) ──────────────────────────────────────────────────────
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.15@sha256:2f8e7b656f09db697a8875177694b417b35cb76c21370de07fc54e711e902326
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      # JWKS verify set (ES256 public + legacy HS256 oct) when JWT_JWKS is set; else HS256.
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # Realtime: intentionally omitted — the app does not use Supabase realtime
  # subscriptions (no .channel()/postgres_changes anywhere). Dropping it also avoids
  # the supabase_realtime_admin role that the self-host postgres image doesn't create.

  # ── Storage (STATEFUL: pinned to local). Env MIRRORS local so the restored ──────
  #    /mnt/stub/stub/<bucket>/<key>/<version> files resolve. Image transforms off
  #    (app uses next/image on public URLs, not Supabase render) → no imgproxy.
  storage:
    image: public.ecr.aws/supabase/storage-api:v1.67.5@sha256:879a80c2c11e681417fc1dc762bd4fd4e9e88594479bc7edf2b2365e86a81d3a
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    healthcheck:
      # 127.0.0.1 not localhost: storage binds IPv4 only; localhost → ::1 first → refused.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 5
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # JWKS verify set (ES256 public + legacy HS256 oct) when set; else HS256 via AUTH_JWT_SECRET.
      JWT_JWKS: '${JWT_JWKS:-{"keys":[]}}'
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /mnt
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      TENANT_ID: stub
      REGION: ${STORAGE_S3_REGION}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - storage-data:/mnt   # ← extract chtivo-local-storage-*.tar.gz into this volume

  # ── postgres-meta (stateless; backs Studio) ────────────────────────────────────
  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.96.6@sha256:a84cc713585eea7b401e4a2561ec4a1e48c87083d1c7ecb4502f204bb4391300
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # ── Studio (PRIVATE — no nginx route; reach via SSH tunnel to kong:8000/Studio) ─
  studio:
    image: public.ecr.aws/supabase/studio:2026.04.28-sha-89d08a2@sha256:b5fb9c41dd7ef672989ce1a6fecfb260da52f948fecde76c292210cc4ffaf9c9
    restart: unless-stopped
    depends_on:
      meta: { condition: service_started }
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}

  # ── Postgres (STATEFUL: MUST match the dump's version exactly) ──────────────────
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.150@sha256:19b86755fe8c19488956e1514cd28f7dfde5f426e3ca82b7658b38ea557dafc1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      # First-init scripts (run only on an empty data volume): set role passwords
      # from POSTGRES_PASSWORD, JWT GUCs, realtime + webhooks schemas.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - db-data:/var/lib/postgresql/data
    command:
      ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

volumes:
  db-data:
  storage-data:
