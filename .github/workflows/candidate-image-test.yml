name: Candidate infra image test

# Gives third-party infra images the "inherent test" they lack (Phase 0.3, Tier 1 —
# see docs/plans/infra-image-automation.md). On a PR that bumps a Tier-1 service's
# image in the prod compose, boot the CANDIDATE image with its real config and prove
# it starts + serves — catching config/startup incompatibility BEFORE merge.
#
# Also runs (as a no-op "nothing to test") when the harness itself changes, so the
# workflow is exercised on its own PRs.
on:
  # Runs on EVERY PR (required gate for candidate-tested infra images) AND in the merge
  # queue (else queued PRs stall waiting for this required check). Fast-exits "nothing to
  # test" when no Tier-1 image changed, so non-infra entries pay only a few seconds.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      service:
        description: 'service to test (nginx|kong|db|auth|storage|…)'
        required: true
      image:
        description: 'candidate image ref'
        required: true
      base_image:
        description: 'base image ref (REQUIRED for Tier-3: db|auth|storage)'
        required: false

jobs:
  tier1:
    name: Tier-1 candidate boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need the base compose to diff image lines
      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
      - name: Test candidate infra image(s)
        env:
          # PR events set base_ref; merge_group doesn't (base is always main).
          BASE: ${{ github.base_ref || 'main' }}
          DISPATCH_SVC: ${{ github.event.inputs.service }}
          DISPATCH_IMG: ${{ github.event.inputs.image }}
          DISPATCH_BASE: ${{ github.event.inputs.base_image }}
        run: |
          set -euo pipefail
          img_of() { python3 -c "import yaml,sys; d=yaml.safe_load(sys.stdin) or {}; print((d.get('services',{}).get('$1',{}) or {}).get('image',''))"; }

          # Manual dispatch: test exactly what was asked (base_image needed for Tier-3).
          if [ -n "${DISPATCH_SVC:-}" ]; then
            echo "::group::candidate ${DISPATCH_SVC} (${DISPATCH_IMG})"
            bash scripts/smoke/candidate-boot.sh "$DISPATCH_SVC" "$DISPATCH_IMG" "${DISPATCH_BASE:-}"
            echo "::endgroup::"
            exit 0
          fi

          # PR: for each service, test only if its image line changed vs the base.
          # base ref is passed as arg 3 — required by the Tier-3 migration-compat tests
          # (db/auth/storage), ignored by Tier-1/2.
          git fetch -q origin "$BASE"
          tested=0
          test_file() {
            local file="$1"; shift
            for svc in "$@"; do
              local base head
              base=$(git show "origin/$BASE:$file" 2>/dev/null | img_of "$svc" || true)
              head=$(img_of "$svc" < "$file" 2>/dev/null || true)
              if [ -n "$head" ] && [ "$base" != "$head" ]; then
                echo "→ $svc changed in $file: ${base:-none} → $head"
                echo "::group::candidate $svc ($head)"
                bash scripts/smoke/candidate-boot.sh "$svc" "$head" "$base"
                echo "::endgroup::"
                tested=1
              fi
            done
          }
          # Tier-1/2 + Tier-3 (db auth storage) in the prod compose; Tier-1 in monitoring.
          test_file deploy/production/docker-compose.yml nginx kong rest meta db auth storage
          test_file monitoring/docker-compose.yml grafana prometheus node-exporter pushgateway alertmanager postgres-exporter
          [ "$tested" = 1 ] || echo "No candidate-tested infra image changed — nothing to test."
