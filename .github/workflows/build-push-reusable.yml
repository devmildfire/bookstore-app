name: Build & push image (reusable)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Image tag to push (e.g. <sha> or "production")'
      latest:
        required: false
        type: boolean
        default: false
        description: 'Also tag/push :latest (only for canonical main builds, not PR images)'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${IMAGE}:${{ inputs.tag }}"
            [ "${{ inputs.latest }}" = "true" ] && echo "${IMAGE}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # NEXT_PUBLIC_BASE_URL is inlined (OG/metadataBase). SUPABASE_INTERNAL_URL
          # is a build-time-only server var for the SSG prerender data fetch (publicly
          # reachable — the runner can't reach internal kong). The anon key goes via a
          # BuildKit SECRET (not a build-arg) so it never lands in image history; it's
          # mounted only for the build RUN. Neither reaches the runner image.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://bookstore-app.mildfire.dev' }}
            SUPABASE_INTERNAL_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://api.mildfire.dev' }}
          secrets: |
            supabase_anon_key=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
