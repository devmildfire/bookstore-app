name: Build & push image (reusable)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Image tag to push (e.g. <sha> or "production")'
      latest:
        required: false
        type: boolean
        default: false
        description: 'Also tag/push :latest (only for canonical main builds, not PR images)'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${IMAGE}:${{ inputs.tag }}"
            [ "${{ inputs.latest }}" = "true" ] && echo "${IMAGE}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://bookstore-app.mildfire.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
