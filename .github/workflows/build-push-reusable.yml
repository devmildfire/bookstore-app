name: Build & push image (reusable)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Image tag to push (e.g. <sha> or "production")'
      latest:
        required: false
        type: boolean
        default: false
        description: 'Also tag/push :latest (only for canonical main builds, not PR images)'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${IMAGE}:${{ inputs.tag }}"
            [ "${{ inputs.latest }}" = "true" ] && echo "${IMAGE}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # NEXT_PUBLIC_BASE_URL is inlined (OG/metadataBase). SUPABASE_INTERNAL_URL
          # is a build-time-only server var for the SSG prerender data fetch (publicly
          # reachable — the runner can't reach internal kong). The anon key goes via a
          # BuildKit SECRET (not a build-arg) so it never lands in image history; it's
          # mounted only for the build RUN. Neither reaches the runner image.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://bookstore-app.mildfire.dev' }}
            SUPABASE_INTERNAL_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://api.mildfire.dev' }}
          secrets: |
            supabase_anon_key=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
