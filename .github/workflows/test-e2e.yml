name: E2E tests

# Playwright E2E against the full stack (local Supabase + Next.js dev server that
# Playwright launches via webServer). Runs on feature-branch pushes and PRs into
# main — not on every main push (that gets the lighter Tests workflow). The
# production deploy gate (a hard requirement on these) is a follow-up step once
# the suite proves stable — see docs/testing/STRATEGY.md §5.7 / §10 step 5.
on:
  push:
    branches: ['feature/**', 'feat/**']
  pull_request:
    branches: ['main']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.0
      - run: supabase start
      - name: Export Supabase env
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"
      - name: Run E2E (chromium)
        run: npm run test:e2e -- --project=chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
