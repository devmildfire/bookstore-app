name: E2E tests

# Playwright E2E against the full stack (local Supabase + Next.js dev server).
# Feature-branch feedback only — main + PRs run e2e inside ci.yml (gating the image
# build), so they're excluded here to avoid a duplicate run.
on:
  push:
    branches: ['feature/**', 'feat/**']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: ./.github/workflows/test-e2e-reusable.yml
