name: E2E tests

# Playwright E2E against the full stack (local Supabase + Next.js dev server).
# Runs on feature-branch pushes, PRs into main, and main pushes.
on:
  push:
    branches: ['main', 'feature/**', 'feat/**']
  pull_request:
    branches: ['main']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: ./.github/workflows/test-e2e-reusable.yml
