name: Audit

# Dependency vulnerability scan for feature branches, so they're checked before they reach
# the trunk. main + PRs run audit inside ci.yml (gating the image build), so this excludes
# them to avoid a duplicate run. One definition (audit-reusable.yml), two callers.
on:
  push:
    branches-ignore: [main, production]

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/audit-reusable.yml
