name: Audit

# Dependency vulnerability scan on every branch push + PR, so feature branches are checked
# before they reach the trunk. Delegates to the reusable workflow (audit-reusable.yml), which
# the production deploy gate also calls — one definition, two callers.
on:
  push:
  pull_request:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/audit-reusable.yml
