name: Deploy production

# Deploy-ONLY. main's CI (ci.yml) already ran audit → lint → unit → integration →
# e2e and pushed a fully-tested image tagged with the main SHA. Promoting to prod
# just retags that image and rolls the VPS — no re-testing, no rebuild.
#
# The image's existence IS the gate: if main's pipeline didn't pass, the `:<sha>`
# image was never pushed, so `docker pull` below fails and the deploy aborts.
#
# Promote by pushing main onto production:  git push origin main:production
# (fast-forward keeps production an exact mirror of main; a --no-ff merge also
# works — the SHA resolver handles both.) Or run manually from the Actions tab.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Promote image + deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 10

      - name: Resolve the main SHA to deploy
        id: resolve
        run: |
          # Fast-forward / direct push → HEAD itself is the main commit.
          # --no-ff merge promote → parents are [old_production, main]; take parent 2.
          read -ra P <<< "$(git rev-list --parents -1 HEAD)"
          if [ "${#P[@]}" -ge 3 ]; then SHA="${P[2]}"; else SHA="${P[0]}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying image for main SHA: $SHA"

      - name: Require green CI for this SHA
        # e2e now runs AFTER build, so a `:<sha>` image can exist even if e2e
        # failed. Gate on the main CI run's conclusion instead of image existence.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          concl=$(gh run list --commit "$SHA" --workflow=ci.yml \
            --json status,conclusion \
            --jq 'map(select(.status=="completed")) | .[0].conclusion // "none"')
          echo "CI conclusion for $SHA: $concl"
          [ "$concl" = "success" ] || { echo "::error::CI for $SHA is not green ($concl) — refusing to deploy"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote pre-built image to :production
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # Fails (aborting the deploy) if the image doesn't exist — i.e. main CI
          # didn't build/push it because a test gate failed.
          docker pull "${IMAGE}:${SHA}"
          docker tag  "${IMAGE}:${SHA}" "${IMAGE}:production"
          docker push "${IMAGE}:production"

      - name: Roll the app container over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/chtivo
            docker compose pull app
            docker compose up -d app
            docker image prune -f
            docker compose ps app
          '
