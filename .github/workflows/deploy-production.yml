name: Deploy production

# Promote to deploy: push to the `production` branch (e.g. `git push origin main:production`)
# or run manually from the Actions tab. Owns its own test jobs so it never polls other
# pipelines. Builds the app image, pushes it to GHCR, then SSHes to the VPS to roll.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  audit:
    uses: ./.github/workflows/audit-reusable.yml

  unit:
    uses: ./.github/workflows/test-unit-reusable.yml

  integration:
    needs: unit
    uses: ./.github/workflows/test-integration-reusable.yml

  e2e:
    uses: ./.github/workflows/test-e2e-reusable.yml

  # Resolve the main SHA from the merge commit and promote the pre-built
  # image (built by main CI) to the production tag — no rebuild needed.
  promote:
    name: Promote pre-built image
    needs: [audit, unit, integration, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 10
      - name: Resolve main SHA from merge commit
        id: resolve
        run: |
          # On a --no-ff merge commit parents[0]=old_production, parents[1]=main_sha
          MAIN_SHA=$(git rev-list --parents -1 HEAD | awk '{print $3}')
          echo "source_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved main SHA: $MAIN_SHA"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pre-built image and tag as production
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          docker pull ${{ env.IMAGE }}:$SOURCE_SHA
          docker tag  ${{ env.IMAGE }}:$SOURCE_SHA ${{ env.IMAGE }}:production
          docker push ${{ env.IMAGE }}:production

  deploy:
    name: Deploy to VPS
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Roll the app container over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/chtivo
            docker compose pull app
            docker compose up -d app
            docker image prune -f
            docker compose ps app
          '
