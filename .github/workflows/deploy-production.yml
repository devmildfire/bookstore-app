name: Deploy production

# Promote to deploy: push to the `production` branch (e.g. `git push origin main:production`)
# or run manually from the Actions tab. Builds the app image, pushes it to GHCR,
# then SSHes to the VPS and rolls the `app` container.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Hard gate: if this fails, build-and-push (and therefore deploy) never run.
  # Delegates to the shared reusable workflow (same audit as audit.yml).
  audit:
    uses: ./.github/workflows/audit-reusable.yml

  # Hard gate: require the Tests + E2E workflows to be green for THIS exact SHA
  # (or its parents — a --no-ff merge creates a merge commit without its own runs)
  # before building/deploying. Test workflows run on main pushes, so their runs
  # exist for the non-merge parent SHAs. No green tests → no deploy.
  require-tests:
    name: Require green tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Wait for Tests + E2E to pass on this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['Tests', 'E2E tests']

            // Check the merge commit SHA first; if no runs found, check its
            // parents (the actual commits from main that carry test runs).
            const { execSync } = require('child_process')
            const shas = [context.sha]
            const parents = execSync('git rev-list --parents -1 ' + context.sha, { encoding: 'utf-8' }).trim().split(/\s+/)
            // parents[0] is the commit itself, parents[1..n] are its parents.
            // Only check non-production parents (those that had tests run on main).
            for (let i = 1; i < parents.length; i++) shas.push(parents[i])

            core.info(`Gating deploy on [${required.join(', ')}] for [${shas.join(', ')}]`)
            const latest = (runs, name) =>
              runs
                .filter((r) => r.name === name)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]

            for (let attempt = 1; attempt <= 40; attempt++) {
              const allRuns = []
              for (const sha of shas) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: sha,
                  per_page: 100,
                })
                allRuns.push({ sha, runs: data.workflow_runs || [] })
              }
              // Check if ANY SHA satisfies all required workflows
              for (const { sha, runs } of allRuns) {
                for (const name of required) {
                  const run = latest(runs, name)
                  if (run && run.status === 'completed' && run.conclusion !== 'success') {
                    throw new Error(`Required workflow "${name}" concluded "${run.conclusion}" for ${sha} — blocking deploy.`)
                  }
                }
                const done = required.every((name) => {
                  const run = latest(runs, name)
                  return run && run.status === 'completed' && run.conclusion === 'success'
                })
                if (done) {
                  core.info(`✅ All required test workflows are green for ${sha}.`)
                  return
                }
              }
              const pending = required
                .filter((name) => allRuns.every(({ runs }) => {
                  const run = latest(runs, name)
                  return !run || run.status !== 'completed'
                }))
                .join(', ')
              core.info(`Attempt ${attempt}/40 — waiting on: ${pending || '(none)'}`)
              await new Promise((r) => setTimeout(r, 30000))
            }
            throw new Error('Timed out waiting for required test workflows to complete for this SHA.')

  build-and-push:
    name: Build & push image
    needs: [audit, require-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the client bundle at build time.
          # The anon key is public by design; the URL falls back if no repo var is set.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://api.mildfire.dev' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll the app container over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/chtivo
            docker compose pull app
            docker compose up -d app
            docker image prune -f
            docker compose ps app
          '
