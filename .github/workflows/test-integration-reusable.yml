name: Integration tests (reusable)

on:
  workflow_call:

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      SEND_EMAIL_HOOK_SECRET: 'v1,whsec_MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.0
      - name: Disable seed-on-start
        run: sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
      - name: Boot stack (migrations only)
        run: supabase start
      - name: Export Supabase env
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Load seed (pg_dump → psql restore)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql -f supabase/seed-test.sql
      - name: Integration tests
        run: npm run test:integration -- --reporter=verbose --reporter=junit --outputFile=results.junit.xml
      - name: Publish results to job summary
        if: always()
        run: node scripts/junit-summary.mjs results.junit.xml "🔌 Integration tests" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: supabase stop --no-backup
