name: Audit (reusable)

# Single source of truth for the dependency vulnerability scan. Called by ci.yml's `audit`
# job (runs on every push + PR to main).
on:
  workflow_call:

jobs:
  npm-audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.1'

      # --audit-level=high fails on high/critical only. The repo carries transitive
      # moderate/low advisories (tar via the supabase dev CLI, js-yaml, @babel/core) that
      # would otherwise hard-block every push/deploy. Tighten to `moderate` once cleared.
      # Uses the committed lockfile — no npm ci needed, so this is fast.
      - name: Audit dependencies
        run: npm audit --audit-level=high
