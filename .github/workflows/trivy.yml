name: Trivy

# Nightly vulnerability + misconfig + secret scanning. The deployed :production image
# and the repo filesystem GATE on HIGH/CRITICAL (fail the run → GitHub notifies); a
# CRITICAL in the image additionally pages Telegram. The next-promote image (:latest)
# and the third-party Supabase images are scanned informationally (never fail).
on:
  schedule:
    - cron: '0 3 * * *' # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull :production / :latest from GHCR
  security-events: write # SARIF upload to Code scanning

jobs:
  # ── The DEPLOYED image (:production): SARIF for visibility, CRITICAL→Telegram, HIGH/CRIT gate. ──
  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy — :production → SARIF (visibility)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/devmildfire/bookstore-app:production
          format: sarif
          output: trivy-prod.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # this pass only produces the SARIF; the gate below fails the run
      - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: always()
        with:
          sarif_file: trivy-prod.sarif
          category: trivy-prod-image
      - name: Trivy — :production CRITICAL check (drives the Telegram page)
        id: crit
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/devmildfire/bookstore-app:production
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Telegram page — CRITICAL only
        if: steps.crit.outcome == 'failure'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🛑 Trivy: CRITICAL CVE in DEPLOYED image (:production) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Trivy — :production gate (fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/devmildfire/bookstore-app:production
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ── Filesystem: vuln + misconfig + secret. Gates on HIGH/CRITICAL. ──
  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy — fs (vuln + misconfig + secret), gate on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── Informational (NO gate): next-promote image :latest + the third-party Supabase stack. ──
  informational-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2 # gentle on public.ecr.aws's anonymous pull rate limit (avoids TOOMANYREQUESTS)
      matrix:
        # Mirrors the third-party image versions in deploy/production/docker-compose.yml.
        # Hand-maintained: Renovate bumps those compose pins (kong / postgres-meta) but NOT
        # this list, so update these tags whenever the compose pins move, or the scan silently
        # reports on stale versions. See docs/plans/dependency-monitoring.md §7.
        image:
          - ghcr.io/devmildfire/bookstore-app:latest
          - public.ecr.aws/supabase/postgres:17.6.1.106
          - public.ecr.aws/supabase/gotrue:v2.188.1
          - public.ecr.aws/supabase/storage-api:v1.54.1
          - public.ecr.aws/supabase/postgrest:v14.10
          - public.ecr.aws/supabase/postgres-meta:v0.96.6
          - kong/kong:3.9.3
    steps:
      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # continue-on-error: this scan is purely informational. A transient ECR rate-limit /
      # pull failure here must NOT fail the run (exit-code:'0' only suppresses *vuln* findings,
      # not Trivy's fatal "can't pull image" error).
      - name: Trivy — ${{ matrix.image }} (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          output: trivy-info.txt
      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## Trivy (informational) — ${{ matrix.image }}"
            echo '```'
            cat trivy-info.txt 2>/dev/null || echo "(scan unavailable — image pull failed / rate-limited)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
