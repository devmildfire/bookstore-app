name: CI

# The single pipeline for main + PRs: audit → lint → unit → integration → e2e,
# then (main pushes only) build + push the Docker image — gated on ALL of the
# above. The image that main produces is fully tested, so deploy-production.yml
# just promotes + ships it (no re-testing). Tests run once, the image is built
# once. `main` is PR-only, so every change runs this pipeline via its PR — there are no
# standalone branch-push CI workflows.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/audit-reusable.yml

  lint:
    name: Lint & build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
      # Reuse Next's incremental build cache for the PR build check below.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run lint
      # PR only: validate the production build without producing an image. On main
      # pushes the build job below builds the Docker image (which runs `next build`
      # itself), so building here too would be redundant work.
      - name: Build (validate)
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://api.mildfire.dev' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  unit:
    uses: ./.github/workflows/test-unit-reusable.yml

  integration:
    needs: unit
    uses: ./.github/workflows/test-integration-reusable.yml

  # Build the image once the source gates pass, then run e2e AGAINST that image.
  # Pushes :<sha> on PRs too (so e2e can pull it); :latest only on canonical main.
  build:
    needs: [audit, lint, unit, integration]
    uses: ./.github/workflows/build-push-reusable.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      tag: ${{ github.sha }}
      latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # E2E drives the REAL built image (not `next dev`) against a local Supabase
  # stack — the env-agnostic image configured purely via runtime env. Because
  # e2e runs AFTER build, deploy-production.yml gates on the SHA's CI conclusion
  # (image existence alone no longer implies e2e passed).
  e2e:
    needs: build
    uses: ./.github/workflows/test-e2e-reusable.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
