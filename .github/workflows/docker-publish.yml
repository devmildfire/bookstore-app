name: CI

on:
  push:
    branches: ['update', 'main', 'staging']
  pull_request:
    branches: ['main', 'staging']

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Persist Next.js's incremental build cache between runs (the "No build cache found"
      # warning). setup-node already caches ~/.npm; this caches .next/cache so webpack/compile
      # artifacts are reused. Key on lockfile + source so it invalidates on real changes;
      # restore-keys allow partial reuse when only source changed.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # URL is a repo variable (not secret); fall back to the public prod URL
          # so a clean build always has a valid NEXT_PUBLIC_SUPABASE_URL.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://api.mildfire.dev' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
