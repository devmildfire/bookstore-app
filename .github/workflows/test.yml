name: Tests

# Unit + integration tests on every push/PR to main. Both are now reusable
# workflows, so deploy-production.yml can call them directly — no polling needed.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ./.github/workflows/test-unit-reusable.yml

  integration:
    needs: unit
    uses: ./.github/workflows/test-integration-reusable.yml
