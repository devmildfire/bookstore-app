name: Tests

# Unit + integration tests on every push/PR to main. On main pushes the
# Docker image is also built + pushed to GHCR so deploy-production.yml
# can pull a pre-built image instead of rebuilding.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ./.github/workflows/test-unit-reusable.yml

  integration:
    needs: unit
    uses: ./.github/workflows/test-integration-reusable.yml

  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [unit, integration]
    uses: ./.github/workflows/build-push-reusable.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      tag: ${{ github.sha }}
