name: Unit tests (reusable)

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --coverage --reporter=verbose --reporter=junit --outputFile=results.junit.xml
      - name: Publish results to job summary
        if: always()
        run: |
          node scripts/junit-summary.mjs results.junit.xml "🧪 Unit tests" >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
