name: Renovate failure alert

# The autonomous dependency loop (renovate.json) auto-merges updates on green CI.
# "When it goes wrong": an auto-update that breaks FAILS ci.yml → auto-merge holds
# (nothing bad lands) → this workflow pings Telegram so you come look at the kink.
# See docs/plans/dependency-monitoring.md.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions: {}

jobs:
  alert:
    # Only for Renovate's own branches, and only on failure.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram — auto-update failed CI
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=⚠️ Dependency auto-update needs you — ${BRANCH} FAILED CI, so the loop will NOT merge it. Review: ${RUN_URL}"
