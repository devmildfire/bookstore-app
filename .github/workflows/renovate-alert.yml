name: Renovate failure alert

# The autonomous loop auto-merges updates on green CI. "When it goes wrong": an
# auto-update that breaks FAILS ci.yml → auto-merge holds → this pings Telegram.
# Majors (labeled `major` in renovate.json) get an explicit BREAKING-change message
# so you know it needs a real decision, not just a transient flake.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  pull-requests: read

jobs:
  alert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Telegram — auto-update failed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          title=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json title -q '.[0].title' 2>/dev/null)
          url=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url' 2>/dev/null)
          is_major=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json labels -q '.[0].labels[].name' 2>/dev/null | grep -qx major && echo yes || echo no)
          title=${title:-$BRANCH}; url=${url:-$RUN_URL}
          if [ "$is_major" = yes ]; then
            msg="🚨 MAJOR update — NEEDS YOUR DECISION. \"$title\" has BREAKING changes and FAILED CI, so the loop will NOT merge it. Migrate it or skip: $url"
          else
            msg="⚠️ Dependency auto-update FAILED CI — \"$title\". The loop will NOT merge it. Review: $url"
          fi
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode "text=${msg}"
