name: Renovate

# Self-hosted Renovate (not the Mend hosted App), authenticating as the fine-grained PAT in
# RENOVATE_TOKEN so its PRs trigger ci.yml (GitHub suppresses workflow triggers from GITHUB_TOKEN).
# Renovate reads renovate.json ON THE DEFAULT BRANCH (main). Operating guide:
# docs/plans/dependency-monitoring.md.
on:
  # SELF-HEALING REBASE: run after every merge to main so PRs it left CONFLICTED (rebaseWhen:
  # conflicted — e.g. a lockfile clash) get regenerated → CI → auto-merge → push → again. Interim
  # until the repo gets a native merge queue (docs/plans/org-merge-queue.md). NOTE: this only
  # drains while things merge — a stalled loop is caught by the weekly digest below, not here.
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * 2'
  # Also dispatched by trivy.yml when a NEW critical finding appears (fast-tracks the fix PR).
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        required: false
      digest:
        description: 'Also send the health digest to Telegram'
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.175.2

jobs:
  renovate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read # sparse checkout of the notify script (Renovate itself uses RENOVATE_TOKEN)
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commits authored as the PAT owner (not Mend's renovate@whitesourcesoftware.com default).
          RENOVATE_GIT_AUTHOR: 'devmildfire <97608157+devmildfire@users.noreply.github.com>'
          # Self-hosted allowlist for renovate.json postUpgradeTasks (global-only option).
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/sync-monorepo-siblings\\.mjs$"]'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
      # Renovate itself breaking (expired PAT, config error) used to surface only as a GitHub email.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure()
        with:
          sparse-checkout: scripts/notify-telegram.sh
          sparse-checkout-cone-mode: false
      - name: Telegram — Renovate run failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          scripts/notify-telegram.sh "🔴 Renovate run FAILED (expired RENOVATE_TOKEN? config error?) —
          no dependency updates until fixed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Weekly health digest of the loop ITSELF (stalls, red PRs, prod lag, open criticals, PAT expiry).
  # Always sent on the schedule — the ✅ heartbeat also proves the alert path is alive.
  # Supabase images track Supabase's own self-hosted stack (renovate.json disables Renovate for
  # them). Weekly: move pins UP to upstream's versions (never past, never down) and open a PR —
  # the Tier-2/3 candidate tests + CI gate it like any update. Branch is deps/… not renovate/…
  # (Renovate prunes renovate/* branches it didn't create).
  supabase-upstream:
    if: ${{ github.event_name == 'schedule' || inputs.digest }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read # pushes/PRs use RENOVATE_TOKEN so CI triggers (GITHUB_TOKEN can't)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
      - name: Sync Supabase pins to upstream → PR
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          BRANCH: deps/supabase-upstream
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/supabase-upstream.py --apply | tee sync.txt
          git diff --quiet && { echo "Already aligned with Supabase upstream."; exit 0; }
          git config user.name 'devmildfire'
          git config user.email '97608157+devmildfire@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git commit -qam "chore(deps): align Supabase images with Supabase's self-hosted stack"
          git push -qf origin "$BRANCH"
          body="Moves Supabase images up to the versions Supabase's own [self-hosted compose](https://github.com/supabase/supabase/blob/master/docker/docker-compose.yml) ships (policy: never ahead of it). Gated by CI + Tier-2/3 candidate tests.
          \`\`\`
          $(cat sync.txt)
          \`\`\`"
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): align Supabase images with Supabase's self-hosted stack" --body "$body"
          gh pr merge "$BRANCH" --auto --squash

  digest:
    needs: renovate
    # Weekly only (+ manual dispatch with digest=true). Not on push (the rebase cascade) and not on
    # trivy.yml's fast-track dispatch — repeat digests on the same day are noise.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.digest) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      security-events: read # code-scanning + Dependabot alert counts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            deploy/production/docker-compose.yml
      - name: Dependency-loop health → Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }} # only to read its own expiry header
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          msg=$(scripts/dependency-health.sh)
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/notify-telegram.sh "$msg"
