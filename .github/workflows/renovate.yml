name: Renovate

# Self-hosted Renovate (not the Mend hosted App). Runs weekly + on manual dispatch,
# authenticating as the fine-grained PAT in RENOVATE_TOKEN so its PRs trigger ci.yml
# (the default GITHUB_TOKEN cannot — GitHub suppresses workflow triggers from it).
# Renovate reads the per-repo config from renovate.json ON THE DEFAULT BRANCH (main).
on:
  # SELF-HEALING REBASE: run Renovate after every merge to main. Any open PR now CONFLICTED
  # (rebaseWhen: "conflicted" in renovate.json — e.g. a lockfile clash) gets its lockfile
  # regenerated → CI re-runs → auto-merges → pushes main → triggers this again: a self-
  # draining cascade. Only *conflicted* PRs rebase (not every behind branch), so no CI storm;
  # grouping keeps conflicts rare. (This is the interim mechanism until the repo moves to an
  # org and gets a native merge queue — see docs/plans/org-merge-queue.md.)
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * 2'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        required: false

concurrency:
  group: renovate
  cancel-in-progress: false

# The action uses RENOVATE_TOKEN for all GitHub API calls, so the workflow's own
# GITHUB_TOKEN needs no permissions.
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

  # Residual digest: the autonomous loop auto-merges everything it can verify. Whatever
  # is left needs YOU (an untested docker image, or a docker major) — ping so it never
  # piles silently. Failures of auto-merge PRs are covered separately by renovate-alert.yml.
  digest:
    needs: renovate
    # Not on push — the rebase cascade runs Renovate on every merge; don't ping each time.
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Ping Telegram if manual-review updates await
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh pr list --repo "$REPO" --state open --label needs-review --json number -q 'length')
          echo "needs-review PRs: ${count:-0}"
          if [ "${count:-0}" -gt 0 ]; then
            curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              --data-urlencode "text=🔧 ${count} dependency update(s) need your review — can't auto-merge (untested infra image or docker major): https://github.com/${REPO}/pulls?q=is%3Aopen+label%3Aneeds-review"
          fi
