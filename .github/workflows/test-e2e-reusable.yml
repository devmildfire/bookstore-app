name: E2E tests (reusable)

on:
  workflow_call:
    inputs:
      image:
        required: false
        type: string
        default: ''
        description: >-
          If set, run E2E against this already-built Docker image (pulled + run
          here) instead of `next dev`. Proves the real, env-agnostic artifact
          works against a test stack. Empty → dev-server mode (feature branches).

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEND_EMAIL_HOOK_SECRET: 'v1,whsec_MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.0
      - name: Disable seed-on-start
        run: sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
      - name: Boot stack (migrations only)
        run: supabase start
      - name: Export Supabase env
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Load seed (pg_dump → psql restore)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql -f supabase/seed-test.sql
      # IMAGE MODE: run the real built artifact against the local stack, configured
      # entirely by runtime env (no env-specific values baked). --network host so the
      # container reaches 127.0.0.1:54321 (Supabase) and binds 0.0.0.0:3000 for Playwright.
      - name: Run the built image
        if: inputs.image != ''
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker pull '${{ inputs.image }}'
          docker run -d --name app --network host \
            -e NODE_ENV=production -e HOSTNAME=0.0.0.0 -e PORT=3000 \
            -e SUPABASE_INTERNAL_URL=http://127.0.0.1:54321 \
            -e SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            -e APP_BASE_URL=http://localhost:3000 \
            -e PAYMENT_PROVIDER=mock \
            -e SEND_EMAIL_HOOK_SECRET="$SEND_EMAIL_HOOK_SECRET" \
            '${{ inputs.image }}'
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:3000/ >/dev/null || { echo '::error::image did not become ready'; docker logs app; exit 1; }
          {
            echo 'E2E_AGAINST_IMAGE=1'
            echo 'E2E_BASE_URL=http://localhost:3000'
          } >> "$GITHUB_ENV"
      - name: Run E2E (chromium)
        run: npm run test:e2e -- --project=chromium
      - name: Publish results to job summary
        if: always()
        run: node scripts/junit-summary.mjs results.junit.xml "🎭 E2E tests" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: App container logs (on failure)
        if: failure() && inputs.image != ''
        run: docker logs app || true
      - if: always() && inputs.image != ''
        run: docker rm -f app || true
      - if: always()
        run: supabase stop --no-backup
